name: "app"

services:
  shop:
    container_name: shop
    build:
      context: ./docker
      dockerfile: Dockerfile-dev
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    restart: unless-stopped
    working_dir: /var/www/html
    tty: true
    ports:
      - 127.0.0.1:${HTTP_PORT:-8001}:80
    environment:
      TZ: Asia/Tashkent
      DB_HOST: db         
      DB_NAME: shop       
      DB_PORT: 3306
      DB_USER: shop
      DB_PASSWORD: password
    volumes:
      - ./:/var/www/html:rw
      - ./docker/supervisor:/etc/supervisor
    depends_on:
      - db
  db:
    container_name: mysql
    image: "mariadb:10.5.2"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-shop}"
      MYSQL_USER: "${DB_USERNAME:-shop}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - "db_data:/var/lib/mysql"
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
      
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
      
