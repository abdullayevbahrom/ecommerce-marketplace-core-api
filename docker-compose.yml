name: "app"

services:
  shop:
    container_name: shop
    build:
      context: ./docker
      dockerfile: Dockerfile-dev
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    restart: unless-stopped
    working_dir: /var/www/html
    tty: true
    ports:
      - 127.0.0.1:${HTTP_PORT:-8002}:80
    environment:
      TZ: Asia/Tashkent
      DB_HOST: app-market-backend-db-1
      DB_NAME: app
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
    volumes:
      - ./:/var/www/html:rw
      - ./docker/supervisor:/etc/supervisor
    networks:
      - default
      - asad_network

networks:
  default:
    driver: bridge
  asad_network:
    external: true
    name: app-market-backend_default
      
