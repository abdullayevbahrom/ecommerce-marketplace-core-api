# E-IMZO Server Configuration
# Documentation: https://github.com/qo0p/e-imzo-doc

# Server listen settings
listen.ip=0.0.0.0
listen.port=8080

# VPN connection to E-IMZO infrastructure
# Production: vpn.e-imzo.uz:3443
# Testing:    testvpn.e-imzo.uz:2443
vpn.tls.enabled=yes
vpn.connect.host=testvpn.e-imzo.uz
vpn.connect.port=2443
vpn.key.file.path=keys/test-eimzo.example.com-2026-09-19.key
vpn.key.password=2FE2B8EC335802F7
vpn.truststore.file.path=keys/test-vpn.jks
tsp.jks.file.path=keys/test-truststore.jks

# Mobile signing configuration
# SiteID obtained from NIC NT (Zamira opa @baxaabdu)
# Upload URL registered: https://api.example.com/v1/integration/eimzo
mobile.siteId=3383

# Redis for mobile DocumentID state management
mobile.storage.redis.host=eimzo-redis
mobile.storage.redis.port=6379
mobile.storage.redis.password=eimzo_secret_2026
mobile.storage.redis.db=1

# Challenge cache (shared state for multi-server deployments)
cache.type=redis
cache.redis.host=eimzo-redis
cache.redis.port=6379
cache.redis.connect.timeout.ms=2000
cache.redis.so.timeout.ms=2000
cache.redis.password=eimzo_secret_2026
cache.redis.db=0
