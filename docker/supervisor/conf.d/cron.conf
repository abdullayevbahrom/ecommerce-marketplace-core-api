[program:cron]
command=/bin/sh -c "echo '* * * * * /usr/local/bin/php /var/www/html/yii rabbit/publish-outbox >> /proc/1/fd/1 2>&1' | crontab - && crond -f -l 8"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
